<script type="text/javascript">
    // 1.2.2 for -> filter, if -> predicate
    var users_under_30=filter(users, user => user.age<30); // filter는 배열을 반환한다. user => user.age<30은 predicate이다.
    console.log(users_under_30.length); // 2
    console.log(users.filter(user => user.age<30).length); // 2, ES6에서는 filter, map, reduce가 내장되어 있다.

    // 30세 이상 이름만 추출한 뒤 쉼표로 연결된 문자열
    // type 1
    var names=filter(users, user => user.age>=30).map(user => user.name).join(','); // filter는 배열을 반환한다. map은 배열을 반환한다. join은 문자열을 반환한다.
    // type 2
    var names=users
        .filter(user => user.age>=30) // 30세이상자 추리고
        .map(user => user.name) // 이름만 추리고
        // 쉼표로 연결된 문자열로 만든다. acc는 누적값, name은 현재값이다. 
        // acc는 초기값이 없으면 배열의 첫번째 요소가 된다. 따라서 초기값을 ''로 설정해야 한다.(생략 가능)
        .reduce((acc, name) => `${acc}, ${name}`, ''); 
    console.log(names); // Lee, Kim, Park, Choi
